<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiagMoto — Login</title>
<style>
  :root {
    --azul: #2563eb; --roxo: #7c3aed; --vermelho: #dc2626;
    --cinza-fundo: #f1f5f9; --texto: #1e293b; --texto-suave: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, var(--azul) 0%, var(--roxo) 100%);
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 10px 30px rgba(0,0,0,.2);
    width: 100%; max-width: 380px; text-align: center;
  }
  .card h1 { margin: 0 0 4px; font-size: 24px; color: var(--texto); }
  .card p { margin: 0 0 24px; color: var(--texto-suave); font-size: 13.5px; }
  label { display: block; text-align: left; font-weight: 600; font-size: 13.5px; margin-bottom: 6px; color: var(--texto); }
  input {
    width: 100%; padding: 12px 14px; font-size: 15px;
    border: 1.5px solid #e2e8f0; border-radius: 10px;
    margin-bottom: 16px; background: #fafbfc;
  }
  input:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  button {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 600;
    border: none; border-radius: 10px; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--azul), var(--roxo));
    transition: transform .15s;
  }
  button:hover { transform: translateY(-1px); }
  #erro {
    color: var(--vermelho); font-size: 13.5px; margin-top: 12px;
    min-height: 18px; font-weight: 600;
  }
</style>
</head>
<body>

  <div class="card">
    <h1>🏍️ DiagMoto</h1>
    <p>Faça login para acessar o diagnóstico técnico</p>

    <form id="formLogin">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" placeholder="Digite seu usuário" required autocomplete="username">

      <label for="senha">Senha</label>
      <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">

      <button type="submit">Entrar</button>
      <div id="erro"></div>
    </form>
  </div>

<script>
  const form = document.getElementById('formLogin');
  const erroDiv = document.getElementById('erro');

  // Se já estiver logado, redireciona direto para o app
  if (localStorage.getItem('token')) {
    window.location.href = '/index.html';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroDiv.textContent = '';

    const usuario = document.getElementById('usuario').value.trim();
    const senha = document.getElementById('senha').value;

    try {
      const resp = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha })
      });

      const data = await resp.json();

      if (!resp.ok) {
        erroDiv.textContent = data.mensagem || 'Usuário ou senha inválidos.';
        return;
      }

      localStorage.setItem('token', data.token);
      window.location.href = '/index.html';

    } catch (err) {
      erroDiv.textContent = 'Erro ao conectar com o servidor. Tente novamente.';
    }
  });
</script>

</body>
</html>
